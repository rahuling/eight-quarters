name: Test, export and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install container deps (fontconfig, unzip, curl)
        run: apt-get update -qq && apt-get install -y -qq fontconfig libfontconfig1 unzip curl ca-certificates

      - name: Install web export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.7.2.stable
          curl -sL --fail -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          cd /tmp
          unzip -o -j templates.tpz "templates/web_nothreads_release.zip" "templates/web_nothreads_debug.zip" -d /github/home/.local/share/godot/export_templates/4.7.2.stable/
          ls -la /github/home/.local/share/godot/export_templates/4.7.2.stable/

      - name: Import assets
        run: godot --headless --path . --import

      - name: Logic tests
        run: godot --headless --path . --script res://tests/test_logic.gd

      - name: Export web build (single-threaded, no COOP/COEP needed)
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
